name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: script/requirements-fonts.txt
      - run: npm ci
      - run: python -m pip install --requirement script/requirements-fonts.txt
      - run: python script/subset_fonts.py --check
      - run: npm run doctor
      - run: npm run scripts:lint
      - run: npm run data:validate
      - run: npm run privacy:check
      - run: npm run web:check
      - run: npm run web:budget
      - run: npm run cloudflare:check

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: ./script/build_and_run.sh --verify
